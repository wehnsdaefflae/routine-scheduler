# routine-scheduler server config (~/.config/routine-scheduler/config.yaml). Written from
# config/config.example.yaml by the daemon's first boot — or by deploy/install.sh, which runs the
# same bootstrap.ensure_config — with BOTH tokens replaced by random ones. Never copy the example
# by hand: a copy keeps its placeholder tokens, which anyone can read in the repository.

bind: 127.0.0.1        # 0.0.0.0 to expose on the LAN
port: 8321
token: "change-me"     # bearer token for the web UI / API — generated on first boot
routine_token: "change-me-too"  # second tier: injected into runs as RSCHED_API_TOKEN; refused on
                                # config-mutating routes — generated on first boot

routines_home: ~/routines

# The library — ONE git repo holding workflows/ (control-flow patterns), rules/, permissions/,
# patterns/ (settings patterns), reminders/, playbooks/ and utils/ (the global utils routines run
# code through). Set libraries_remote to clone it from — and push it to — a repo of yours.
libraries_home: ~/.local/share/routine-scheduler-libraries
libraries_remote: ""   # e.g. https://github.com/<you>/routine-scheduler-libraries.git
# Whether a routine may create/revise utils — and whether that asks for approval — is NOT a
# server switch: it is the routine's own write_util / revise_util capability and its `confirm`
# dial (docs/rules-permissions.md).

max_concurrent_runs: 2
registry_rescan_s: 30

# Util-subprocess sandbox (docs/sandboxing.md): every util runs inside a Landlock jail
# scoped to the run's permissions, with declared-only secrets and per-util network.
#   permissive (default) — jail when the kernel supports Landlock; warn + run bare when not
#   strict               — refuse to run utils unsandboxed instead of warning
#   off                  — never wrap (secrets scoping still applies)
sandbox: permissive

# Chat-completion endpoints — model TRANSPORTS only; this scheduler's engine is the one and only
# harness. NONE are configured by default: add the ones you use in the web UI (Settings → LLM
# endpoints), which explains what credential each kind needs. Full guide with provider recipes
# (OpenRouter, Featherless, Ollama, vLLM, …): docs/endpoints.md (also in the console's Help tab).
# kind: openai | anthropic
#   openai     — any OpenAI-compatible API (OpenRouter, Featherless, vLLM, Ollama, …).
#                Needs an API key (Ollama: none).
#   anthropic  — Messages API: direct API key or subscription proxy client key.
#                For CLIProxyAPI setup, see docs/claude-proxy-cutover.md.
# Models are a CATALOG over those endpoints, each entry named once and picked by that name. Each
# ROUTINE picks its own (main / tool_call, plus an optional uncensored one) in the UI or its
# routine.yaml. The only server-level model is system_model below: the ONE fallback for machine
# work that isn't a routine yet — the new-routine clarify flow and workflow generation — and for
# any role a routine leaves unset.
#
# endpoints: {}          # transports — populated from the UI
# models: {}             # the catalog: name → {endpoint, model, …} — populated from the UI
# system_model: ""       # a catalog model NAME — set from the UI once the catalog has one

# DECISION models — typed classifiers that answer with probabilities, never text (TypeSafe's
# Jev, OpenAI's Decisions API, a self-hosted deploy/decision-server). Their own catalog, behind
# the `decide` action; with none configured no run is shown that action. Settings → Decision
# endpoints, or docs/decision-models.md.
# protocol: openai (POST {base}/decisions — text + images) | systemone (POST {base}/systemone — Jev, text)
#
# decision_endpoints: {}     # e.g. openrouter-jev: {protocol: systemone, base_url: https://openrouter.ai/api/v1, key_var: OPENROUTER_API_KEY}
# decision_models: {}        # e.g. jev: {endpoint: openrouter-jev, model: typesafe/jev-1.13}
# decision_model: ""         # the default a decide call uses
# decision_media_model: ""   # the default for a call that carries images
