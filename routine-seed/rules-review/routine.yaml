name: Rules review
description: Reads how runs actually interpreted each general rule and revises the
  shared text from that evidence — the rules improve from the field, not from a desk.
tags:
- meta
- maintenance
- rules
slug: rules-review
enabled: false
schedule:
  cron: 0 7 * * 3
  tz: Europe/Berlin
  catchup: skip
permissions:
- global-utils
- memory
- rule-authoring
rules:
- ask-policy
- decision-record
- evidence-discipline
- review-recall
- intent-inference
- change-restraint
- problem-routing
- root-cause-fix
capabilities:
  actions:
  - memory_read
  - memory_write
  - write_rule
  utils: []
  confirm: always
  rule_confirm: always
  runs: all
  workflows: catalog
budgets:
  max_turns: 60
  max_wall_clock_min: 45
  max_total_tokens: -1
  max_subruns: 4
  max_subrun_depth: 1
  ask_timeout_min: 480
retention:
  keep_runs: 30
fs_read_roots:
- ~/routines
- ~/conversations
