<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Declare dual-scheme support at the DOCUMENT level, not only in base.css's `color-scheme`
     property. This is the companion the CSS property is meant to have: a force-darkening browser
     (Android "Auto Dark Theme", some desktop dark-mode extensions) keys its opt-out off THIS meta,
     so without it a page whose CSS says `color-scheme: light` (the user picked light) can still be
     re-darkened over the top — which is exactly "the light setting doesn't make anything light".
     `dark light` keeps dark the expressed default so nothing flashes for the shipped dark theme. -->
<meta name="color-scheme" content="dark light">
<title>rsched · ops console</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/views.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%233fd8c2' stroke-width='8'/><circle cx='50' cy='16' r='9' fill='%233fd8c2'/></svg>">
<!-- PWA install (home screen) — the prerequisite for Web Push on iOS Safari, which delivers
     pushes only to a console installed to the home screen. See static/manifest.webmanifest. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="rsched">
<link rel="apple-touch-icon" href="/static/icon.svg">
<!-- The stored theme is applied BEFORE first paint. Deferring it to app.js would show a dark
     console for a frame to somebody who chose light, which is the one thing a theme setting
     must never do. Dark is the shipped default, so a browser that has never been told stays
     exactly as it was. -->
<script>
  try {
    var t = localStorage.getItem("rsched_theme");
    document.documentElement.dataset.theme = (t === "light" || t === "auto") ? t : "dark";
  } catch (e) { /* private mode: the default in the markup stands */ }
</script>
</head>
<body>
<!-- The rail: one chrome, and the destinations grouped by what they are FOR. -->
<header class="topbar">
  <a class="brand" href="#/">
    <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="8"/>
      <circle cx="50" cy="16" r="9" fill="currentColor"/>
      <line x1="50" y1="50" x2="72" y2="34" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">rsched</span>
    <span class="brand-ver" id="app-version" title="release · commit of the running checkout"></span>
  </a>
  <nav id="nav" aria-label="sections">
    <span class="nav-group">Work</span>
    <a href="#/conversations" data-nav="conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-4.5A8 8 0 0 1 13 4a8 8 0 0 1 8 8Z"/></svg>Conversations</a>
    <!-- An INBOX TRAY, not a question mark: Decisions and Help both drew a circled "?" with a
         dot, and below 1180px the rail drops its labels — so the bottom bar offered two
         identical glyphs and the one destination the palette calls SUMMONS was
         indistinguishable from the documentation. -->
    <a href="#/questions" data-nav="questions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 13.5h5l1.5 2.5h5l1.5-2.5h5"/><path d="M6.2 4.6 3 13.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4.5L17.8 4.6A2 2 0 0 0 15.9 3.3H8.1a2 2 0 0 0-1.9 1.3Z"/></svg>Decisions<span id="q-badge" class="badge" hidden></span></a>
    <a href="#/messages" data-nav="messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>Messages</a>
    <span class="nav-group">Fleet</span>
    <a href="#/routines" data-nav="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="5" rx="1.5"/><rect x="14" y="15" width="7" height="5" rx="1.5"/></svg>Routines</a>
    <a href="#/browser" data-nav="browser" id="nav-browser" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><circle cx="6.2" cy="6.5" r=".8" fill="currentColor" stroke="none"/><circle cx="8.8" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg>Browser</a>
    <a href="#/stats" data-nav="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</a>
    <span class="nav-group">System</span>
    <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13Z"/></svg>Library</a>
    <!-- SLIDERS, not a gear: the cog was a 3.2px hub with eight straight spokes, and the rail
         scales every nav glyph to 18px, at which the spokes lose their teeth and it reads as
         the brightness icon the theme toggle uses. -->
    <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17.5 7H20M4 12h2.5M11 12h9M4 17h7M15.5 17H20"/><circle cx="15" cy="7" r="2.1"/><circle cx="8.5" cy="12" r="2.1"/><circle cx="13" cy="17" r="2.1"/></svg>Settings</a>
    <a href="#/help" data-nav="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2A2.6 2.6 0 1 1 12 12.4v1.1"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>Help</a>
  </nav>
  <div class="rail-foot">
    <span id="daemon-dot" class="lamp" title="daemon link"></span>
    <span class="clock" id="clock" aria-label="local time"></span>
    <div class="theme-toggle" id="theme-toggle" role="group" aria-label="colour theme"></div>
  </div>
</header>

<div class="workspace">
  <!-- First-launch notice: the seeded self-improvement routines ship disabled (no hidden costs);
       populated by app.js from /api/status.meta_routines, dismissible via localStorage. -->
  <div id="meta-banner" class="notice-banner" hidden></div>
  <!-- Where you are inside the section the rail has highlighted, plus instance-wide full-text
       search (searchbox.js): "/" or Ctrl-K focuses it from anywhere. -->
  <div class="workbar">
    <nav id="crumbs" class="crumbs" aria-label="breadcrumb"></nav>
    <div id="global-search" class="gsearch"></div>
  </div>
  <!-- The watch ribbon: the last day and the next few hours, on every page. -->
  <div id="ribbon"></div>
  <main id="view"></main>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>
<!-- LLM task manager: a global, hideable dock mirroring what LLM work is in flight across the
     backend. Mounted here (sibling of the workspace) so it survives navigation. -->
<div id="llm-tasks" hidden></div>
<!-- The shared browser's read-only preview: permanent right-rail window onto the session the
     routines drive. Sibling of the workspace (like #llm-tasks) so navigation never re-creates
     the iframe and the VNC connection survives a page change. Hidden until an instance
     publishes a screen (config: browser_view_url). -->
<div id="browser-dock" hidden></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
