# Quality gates run on every commit (install once: `uv run pre-commit install`).
# Local hooks on purpose: everything runs from the project venv — no pinned remote hook
# repos to drift, works offline, and the versions are the ones pyproject declares.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff — strict lint (select ALL, documented ignores)
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python]
      - id: mypy
        name: mypy — type check src/rsched
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml)
      - id: policy
        name: policy — version bump has CHANGELOG entry, no expired migrations, host Python is the image's
        entry: uv run pytest tests/test_policy.py -q
        language: system
        pass_filenames: false
        # every file test_policy reads: a commit moving only the Dockerfile's `FROM python:` or
        # .python-version is exactly the drift its interpreter-pin check exists to stop, and a
        # deploy script can carry a one-shot migration of its own (deploy/backup.sh's)
        files: ^(src/rsched/|deploy/[^/]+\.sh$|CHANGELOG\.md$|Dockerfile$|\.python-version$)
