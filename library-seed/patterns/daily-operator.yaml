title: Daily operator
summary: Performs the day's operations that have side effects out there, verifies them and keeps a log.
workflow: run-daily-operations
when: The job is a recurring chore with effects outside — downloads, a presence on a platform, a dashboard
  rolled to the new day — done every day without an end.
asks:
- field: schedule
  question: When in the day should it run?
settings:
  schedule:
    catchup: skip
    friendly:
      frequency: daily
      time: 05:00
  run_gate:
    checks: []
    enabled: false
    timeout_s: 30
  triggers: []
  improve: true
  permissions:
  - util-authoring
  capabilities:
    actions:
    - revise_util
    - write_util
    utils: []
    confirm: creations
    remind_confirm: always
    reminders: local
    rule_confirm: always
    runs: last
  rules:
  - ask-policy
  - audit-coverage
  - decision-record
  - evidence-discipline
  - feedback-loop
  - fix-the-cause
  - make-failure-visible
  - problem-routing
  - verify-independently
  - web-research
  reminders: []
  grants: {}
  finish_line:
    outcomes: []
    until: ''
  budgets:
    ask_timeout_min: 480
    max_cost: -1
    max_subrun_depth: 2
    max_subruns: 8
    max_total_tokens: -1
    max_total_turns: -1
    max_turns: 100
    max_wall_clock_min: 60
  keep_runs: 30
  fs_read_roots: []
  fs_write_roots: []
  connections: {}
  machines: []
  models: {}
  deliberation: standard
  tags: []
