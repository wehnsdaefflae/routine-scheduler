title: Personal steward
summary: Carries one personal project — an occasion, a plan — on a page you answer and does the outward
  steps once you say go.
workflow: steward-a-project
when: The job is a project of your own with an end — an event, a purchase, a move — rather than a client's
  or a funder's; you steer it through a page.
asks:
- field: schedule
  question: How often do you want the page refreshed?
- field: finish_line
  question: Does it end — on a date, with an outcome the run can check, or with one only you can judge?
settings:
  schedule:
    catchup: skip
    friendly:
      frequency: daily
      time: 06:00
  run_gate:
    checks: []
    enabled: false
    timeout_s: 30
  triggers: []
  improve: true
  permissions:
  - outbound-mail
  - steward-publishing
  - util-authoring
  capabilities:
    actions:
    - revise_util
    - write_util
    utils:
    - fau-mail:send
    - gmail:send
    confirm: creations
    remind_confirm: always
    reminders: local
    rule_confirm: always
    runs: last
  rules:
  - ask-policy
  - correspondence
  - decision-record
  - evidence-discipline
  - feedback-loop
  - fix-the-cause
  - interface-craft
  - problem-routing
  - verify-independently
  - web-research
  - work-order
  - write-as-the-principal
  reminders: []
  grants: {}
  finish_line:
    outcomes: []
    until: ''
  budgets:
    ask_timeout_min: 480
    max_cost: -1
    max_subrun_depth: 2
    max_subruns: 8
    max_total_tokens: -1
    max_total_turns: -1
    max_turns: 150
    max_wall_clock_min: 90
  keep_runs: 30
  fs_read_roots:
  - ~/.local/share/routine-scheduler-libraries/web/steward
  fs_write_roots: []
  connections: {}
  machines: []
  models: {}
  deliberation: standard
  ladder:
    enabled: false
    max_depth: 3
  ladder_rung_height: 20
  oversight_turns: null
  tags: []
