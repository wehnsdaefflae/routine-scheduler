title: Personal steward
summary: Carries one personal project — an occasion, a plan — through the decisions it asks you and
  does the outward steps once you say go.
workflow: steward-a-project
when: The job is a project of your own with an end — an event, a purchase, a move — rather than a client's
  or a funder's; you steer it by answering what it asks.
asks:
- field: schedule
  question: How often should it check on the project and tell you where it stands?
- field: finish_line
  question: Does it end — on a date, with an outcome the run can check, or with one only you can judge?
settings:
  schedule:
    catchup: skip
    friendly:
      frequency: daily
      time: 06:00
  run_gate:
    checks: []
    enabled: false
    timeout_s: 30
  triggers: []
  improve: true
  permissions:
  - outbound-mail
  - util-authoring
  capabilities:
    actions:
    - revise_util
    - write_util
    utils:
    - mail:send
    confirm: creations
    remind_confirm: always
    reminders: local
    rule_confirm: always
    runs: last
  rules:
  - ask-policy
  - correspondence
  - decision-record
  - evidence-discipline
  - feedback-loop
  - fix-the-cause
  - interface-craft
  - problem-routing
  - verify-independently
  - web-research
  - work-order
  - write-as-the-principal
  reminders: []
  grants: {}
  finish_line:
    outcomes: []
    until: ''
  budgets:
    ask_timeout_min: 480
    max_cost: -1
    max_subrun_depth: 2
    max_subruns: 8
    max_total_tokens: -1
    max_total_turns: 0
    max_turns: 150
    max_wall_clock_min: 90
  keep_runs: 30
  fs_read_roots: []
  fs_write_roots: []
  connections: {}
  machines: []
  models: {}
  efforts: {}
  deliberation: standard
  ladder:
    enabled: false
    rung_height: 3
  ladder_turn_interval: 50
  oversight_turns: null
  tags: []
