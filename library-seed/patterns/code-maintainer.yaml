title: Code maintainer
summary: Sweeps a codebase, fixes what it finds, verifies and pushes, and reports; changes to content
  go through a question to you first.
workflow: maintain-a-codebase
when: The job is keeping someone's repositories or website healthy — dependencies, defects, checks — on
  a regular sweep.
asks:
- field: fs_write_roots
  question: Which repositories may it change?
- field: schedule
  question: How often should it sweep?
settings:
  schedule:
    catchup: skip
    friendly:
      frequency: weekly
      time: 06:00
      weekdays:
      - 1
  run_gate:
    checks: []
    enabled: false
    timeout_s: 30
  triggers: []
  improve: true
  permissions:
  - util-authoring
  capabilities:
    actions:
    - revise_util
    - write_util
    utils: []
    confirm: creations
    remind_confirm: always
    reminders: local
    rule_confirm: always
    runs: last
  rules:
  - ask-policy
  - audit-coverage
  - change-scope
  - correspondence
  - decision-record
  - evidence-discipline
  - fix-the-cause
  - git-checkpoint
  - interface-craft
  - make-failure-visible
  - problem-routing
  - verify-independently
  - web-research
  - work-order
  - write-as-the-principal
  reminders: []
  grants: {}
  finish_line:
    outcomes: []
    until: ''
  budgets:
    ask_timeout_min: 480
    max_cost: -1
    max_subrun_depth: 2
    max_subruns: 8
    max_total_tokens: -1
    max_total_turns: -1
    max_turns: 200
    max_wall_clock_min: 120
  keep_runs: 30
  fs_read_roots: []
  fs_write_roots: []
  connections: {}
  machines: []
  models: {}
  deliberation: standard
  ladder:
    enabled: false
    max_depth: 3
  ladder_rung_height: 20
  oversight_turns: null
  tags: []
