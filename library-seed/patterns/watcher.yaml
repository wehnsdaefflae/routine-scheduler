title: Watcher
summary: Checks its sources for what is new since the last run, verifies it and delivers a digest or a
  list — and stays quiet when nothing arrived.
workflow: watch-and-report
when: The job is to keep an eye on sources — newsletters, feeds, catalogs, a mailbox, a timetable — and
  report what is new; nothing is changed out there.
asks:
- field: run_gate
  question: Where does new material arrive — which mailbox and senders, which feed or page, or which folder?
    (A fire with nothing new there is skipped.)
- field: schedule
  question: How often should it look — and by when should the result be ready?
settings:
  schedule:
    catchup: run_once
    friendly:
      frequency: daily
      time: 07:00
  run_gate:
    checks: []
    enabled: false
    timeout_s: 30
  triggers: []
  improve: true
  permissions:
  - steward-publishing
  - util-authoring
  capabilities:
    actions:
    - revise_util
    - write_util
    utils: []
    confirm: creations
    remind_confirm: always
    reminders: local
    rule_confirm: always
    runs: last
  rules:
  - ask-policy
  - audit-coverage
  - decision-record
  - evidence-discipline
  - feedback-loop
  - fix-the-cause
  - problem-routing
  - verify-independently
  - web-research
  reminders: []
  grants: {}
  finish_line:
    outcomes: []
    until: ''
  budgets:
    ask_timeout_min: 480
    max_cost: -1
    max_subrun_depth: 2
    max_subruns: 8
    max_total_tokens: -1
    max_total_turns: -1
    max_turns: 100
    max_wall_clock_min: 60
  keep_runs: 30
  fs_read_roots:
  - ~/.local/share/routine-scheduler-libraries/web/steward
  fs_write_roots: []
  connections: {}
  machines: []
  models: {}
  deliberation: standard
  tags: []
