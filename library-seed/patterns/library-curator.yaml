title: Library curator
summary: Reads how runs used the shared library — rules, utils, recipes — revises what the evidence says
  is wrong and routes what is not its own.
workflow: curate-a-library
when: The job is keeping one part of the shared library fit from how the fleet actually uses it.
asks:
- field: schedule
  question: How often should it review?
settings:
  schedule:
    catchup: skip
    friendly:
      frequency: weekly
      time: 03:00
      weekdays:
      - 0
  run_gate:
    checks: []
    enabled: false
    timeout_s: 30
  triggers: []
  improve: true
  permissions:
  - rule-authoring
  - shell
  - util-authoring
  - util-removal
  capabilities:
    actions:
    - remove_util
    - revise_util
    - shell
    - write_rule
    - write_util
    utils: []
    confirm: creations
    remind_confirm: always
    reminders: local
    rule_confirm: always
    runs: all
  rules:
  - ask-policy
  - audit-coverage
  - change-scope
  - decision-record
  - evidence-discipline
  - fix-the-cause
  - make-failure-visible
  - problem-routing
  - verify-independently
  - web-research
  reminders: []
  grants: {}
  finish_line:
    outcomes: []
    until: ''
  budgets:
    ask_timeout_min: 480
    max_cost: -1
    max_subrun_depth: 2
    max_subruns: 8
    max_total_tokens: -1
    max_total_turns: -1
    max_turns: 100
    max_wall_clock_min: 60
  keep_runs: 30
  fs_read_roots:
  - ~/conversations
  - ~/routines
  fs_write_roots: []
  connections: {}
  machines: []
  models: {}
  deliberation: standard
  tags: []
