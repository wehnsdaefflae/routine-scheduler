title: Model trainer
summary: Polls its training jobs, picks the next increment, prepares data, trains, evaluates and promotes
  — on a GPU machine it shares.
workflow: train-a-model
when: The job is improving a machine-learning model over many runs on a remote GPU.
asks:
- field: machines
  question: Which GPU machine does it train on?
- field: fs_read_roots
  question: Where is the training data?
- field: finish_line
  question: When is the model good enough to stop training — a metric the run can check, or your own judgement?
settings:
  schedule:
    catchup: skip
    friendly:
      frequency: daily
      time: 02:00
  run_gate:
    checks: []
    enabled: false
    timeout_s: 30
  triggers: []
  improve: true
  permissions:
  - shell
  - util-authoring
  capabilities:
    actions:
    - revise_util
    - shell
    - write_util
    utils: []
    confirm: creations
    remind_confirm: always
    reminders: local
    rule_confirm: always
    runs: last
  rules:
  - ask-policy
  - decision-record
  - evidence-discipline
  - fix-the-cause
  - make-failure-visible
  - problem-routing
  - verify-independently
  - web-research
  - work-order
  reminders: []
  grants: {}
  finish_line:
    outcomes: []
    until: ''
  budgets:
    ask_timeout_min: 480
    max_cost: -1
    max_subrun_depth: 2
    max_subruns: 8
    max_total_tokens: -1
    max_total_turns: -1
    max_turns: 200
    max_wall_clock_min: 120
  keep_runs: 30
  fs_read_roots: []
  fs_write_roots: []
  connections: {}
  machines: []
  models: {}
  deliberation: standard
  ladder:
    enabled: false
    max_depth: 3
  ladder_rung_height: 20
  oversight_turns: null
  tags: []
