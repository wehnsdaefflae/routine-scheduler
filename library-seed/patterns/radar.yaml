title: Radar
summary: Ingests many listings, verifies them, keeps a board you pick from and acts on a pick only after
  your sign-off.
workflow: curate-and-act
when: The job is to find opportunities among many listings — jobs, calls, funding programmes — rank them
  for you, and apply or reply once you say yes.
asks:
- field: schedule
  question: How often should it look for new listings?
- field: grants
  question: Which of your accounts may it use to act once you sign off — which mailbox, which signed-in
    sites?
settings:
  schedule:
    catchup: skip
    friendly:
      frequency: daily
      time: 07:00
  run_gate:
    checks: []
    enabled: false
    timeout_s: 30
  triggers: []
  improve: true
  permissions:
  - browser-sessions
  - outbound-mail
  - steward-publishing
  - util-authoring
  capabilities:
    actions:
    - revise_util
    - write_util
    utils:
    - browser-session
    - fau-mail:send
    - gmail:send
    confirm: creations
    remind_confirm: always
    reminders: local
    rule_confirm: always
    runs: last
  rules:
  - ask-policy
  - audit-coverage
  - correspondence
  - decision-record
  - evidence-discipline
  - feedback-loop
  - fix-the-cause
  - interface-craft
  - problem-routing
  - verify-independently
  - web-research
  - write-as-the-principal
  reminders: []
  grants: {}
  finish_line:
    outcomes: []
    until: ''
  budgets:
    ask_timeout_min: 480
    max_cost: -1
    max_subrun_depth: 2
    max_subruns: 12
    max_total_tokens: -1
    max_total_turns: -1
    max_turns: 200
    max_wall_clock_min: 180
  keep_runs: 30
  fs_read_roots:
  - ~/.local/share/routine-scheduler-libraries/web/steward
  fs_write_roots: []
  connections: {}
  machines: []
  models: {}
  deliberation: standard
  tags: []
