[project]
name = "rsched"
dynamic = ["version"]
description = "LLM agent routine scheduler: provider-agnostic workflow-as-harness engine, cron daemon, web UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "croniter>=3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "tenacity>=9.1.4",
    "python-frontmatter>=1.3.0",
    "sse-starlette>=3.4.5",
    "pdoc>=16.0",
    "pywebpush>=2.0",
    "python-multipart>=0.0.9",
    # Imported DIRECTLY across config/ and web/, so they are declared directly. They arrive
    # transitively today (pydantic via fastapi, markdown2 via pdoc, cryptography + py_vapid via
    # pywebpush) — a bump that repins or drops one would otherwise break us silently.
    "pydantic>=2.9",
    "markdown2>=2.5",
    "cryptography>=43.0",
    "py-vapid>=1.9",
]

[project.optional-dependencies]
headroom = ["headroom-ai==0.37.0"]

[project.scripts]
rsched = "rsched.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15",
    "mypy>=1.14",
    "types-croniter",
    "types-jsonschema",
    "types-pyyaml",
    "pytest-playwright>=0.8.0",
    # The rerun shield tests/ui/conftest.py applies to the browser suite.
    "pytest-rerunfailures>=14.0",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# single-source: the version lives in src/rsched/__init__.py (__version__)
[tool.hatch.version]
path = "src/rsched/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rsched"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Parallel by default (pytest-xdist): the suite is hermetic per-test (tmp_path homes,
# ephemeral ports, per-process monkeypatching). One stuck test can't hide behind the
# others' output — use -n0 for a serial run / debugging with -s. worksteal: the fast suite is
# ~2 150 short unit tests, and the default `load` scheduler pre-assigns chunks — the run's tail
# left workers idle while one worker still held a queue; work stealing rebalances that shape.
# `auto` is redefined by tests/conftest.py's pytest_xdist_auto_num_workers hook — cores minus
# one (the measurements are there).
# The BROWSER suite is scheduled differently and tests/conftest.py's pytest_configure switches
# to `loadgroup` whenever it is selected: those ~277 items share ONE headful Chrome sidecar,
# so they are one work unit on one worker while the fast suite keeps spreading.
# `-m "not ui"` keeps that suite out of the default run — two minutes becomes thirty, and it is
# the thirty that decides whether the inner loop gets used. It is deselected, never deleted —
# running it is one flag, the absence is printed after every run, and a release runs everything:
#   uv run pytest -q            the fast gate
#   uv run pytest -q -m ui      the browser suite (serialize it: flock /tmp/rsched-gates.lock)
#   uv run pytest -q -m ""      everything — what ships a release
# A CLI `-m` wins over this one, because addopts are prepended and pytest keeps the last.
addopts = ["-n", "auto", "--dist", "worksteal", "-rR", "-m", "not ui"]  # -rR: name any flaky rerun in the summary (RERUN <nodeid>) so an intermittent UI flake is diagnosable, not just counted
# Remove a PASSING test's tmp dir at its own teardown instead of keeping three whole
# generations. The default (`all`, retention 3) left 85 000 files / 394 MB under
# /tmp/pytest-of-<user> on the deployment — including an abandoned `garbage-*` tree pytest
# had renamed for deletion and never finished removing — and every session paid to prune the
# oldest generation before it could start. `failed` still keeps the tmp dir of any test that
# FAILED, which is the only one anybody ever opens.
tmp_path_retention_policy = "failed"
markers = [
    "flaky: retry a flaky test on failure (pytest-rerunfailures, applied to tests/ui by its conftest)",
    "ui: drives a real browser (tests/ui) — applied to the whole directory by its conftest, deselected by the default -m so the fast gate stays fast; `-m ui` runs them",
]
filterwarnings = [
    "error",  # any warning is a failure — drift surfaces immediately
    # third-party transitional notice (starlette's httpx→httpx2 migration), not ours to fix
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# ---- lint: everything on; every ignore below names the deliberate house-style reason ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Seed trees are not package code and have their own gates, so ruff skips them entirely
# (pre-commit passes --force-exclude, so this holds for explicitly-passed files too):
# - library-seed/workflows: never-executed control-flow DEPICTIONS parsed with ast —
#   pseudo-imports (`from routine.params import …`) are the format; workflows/lint.py gates them.
# - util-seed: PEP 723 single-file scripts with script conventions (print CLI, assert-based
#   --selftest); gated by utils_lib.header_problems + the selftest run, not package lint.
extend-exclude = ["library-seed", "util-seed"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",      # undocumented-*: docstrings are written where they earn their keep, not everywhere
    "D200", "D205", "D212", "D400", "D401", "D404", "D415",  # prose-first docstring voice is house style
    "D203", "D213",  # incompatible-pair halves (D211/D212 chosen)
    "ANN",     # typing is mypy's gate (see [tool.mypy]); ruff doesn't double-police annotations
    "TID252",  # relative imports inside the package are house style
    "PLC0415", # lazy in-function imports are deliberate (startup cost, optional deps)
    "COM812",  # trailing-comma churn; conflicts with non-formatted house layout
    "E741",    # after review: no ambiguous names remain; rule kept off for one-letter loop vars
    "TRY003", "EM101", "EM102",  # message-in-raise is house style; no exception-class zoo
    "TRY300", "TRY301", "TRY400",  # try/except shapes are chosen per-site, not by rule
    "FBT001", "FBT002", "FBT003",  # boolean args on internal seams are fine
    "PLR2004", # magic-value comparisons: HTTP codes and thresholds read better inline
    "S603", "S607",  # spawning subprocesses (utils, git) IS the product
    "BLE001",  # broad excepts are used deliberately on best-effort seams (each carries prose why)
    "SIM105",  # try/except-pass reads clearer than contextlib.suppress at these sites
    "S110",    # best-effort try/except/pass seams (same reason as BLE001)
    "TC001", "TC002", "TC003",  # TYPE_CHECKING import gymnastics hurt readability, help nothing here
    "PERF203", # try/except in loops is the retry pattern
    "ASYNC240", # daemon calls fast local-FS methods (Path.unlink etc.) directly in async handlers by design; local FS is not offloaded to threads (cf. atomic_write_json in the same coroutines)
    "RUF001", "RUF002", "RUF003",  # unicode arrows/dashes in prose strings are intentional
    "PLW2901", # loop-var reassignment used deliberately in normalize passes
    "SLF001",  # private-member access across sibling modules is deliberate at engine seams
    "A002",    # shadowing builtins in narrow scopes (id, input) reads fine
    "ERA001",  # commented code detector false-positives on prose examples
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point
    "S106", "S105",  # hardcoded fake tokens in fixtures
    "ARG001", "ARG002", "ARG005",  # fixture/callback signatures
    "PT011",   # pytest.raises without match: precise types suffice here
    "D",       # test docstrings are optional
    "PLR0913", # fixture-heavy signatures
    "E501",    # long literal lines in scripted-action fixtures
    "PT018",   # composite asserts read as one assertion of one fact; pytest introspection shows parts
]
"src/rsched/cli.py" = ["T201"]  # print IS the CLI's output surface
# The browser sidecar's auth proxy runs INSIDE the chrome image, which has no rsched install
# and no logging config — stderr is its only output surface, and it is executed as a script.
"deploy/browser-auth-proxy.py" = ["T201", "INP001"]
"src/rsched/engine/composer.py" = ["S608"]  # prompt f-strings contain SQL-like words; this file builds prompts, never SQL

[tool.ruff.lint.mccabe]
max-complexity = 22  # ratchet: current worst (engine loop); lower as refactors land

[tool.ruff.lint.pylint]
max-args = 10        # ratchet to current worst; lower over time
max-branches = 22
max-statements = 75
max-returns = 8

# ---- types ----
[tool.mypy]
python_version = "3.12"
files = ["src/rsched"]
plugins = ["pydantic.mypy"]  # teaches mypy the Field(validation_alias=…) defaults
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
ignore_missing_imports = true  # py_vapid/pywebpush/croniter ship no stubs

# ---- coverage ----
[tool.coverage.run]
source = ["src/rsched"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
# Ratchet — never drop below. MEASURED 2026-09-23 at 89.72% (branch, `pytest -q --cov` over the
# fast suite, 2709 passed): the number had not been checked since 0.57.1 and the comment beside
# it claimed 88 while the gate demanded 87. Raise it only against a fresh measurement, and do
# not name `--cov` in the inner-loop gate: coverage costs 375s against 208s, and a ratchet that
# doubles the loop everyone runs is one that gets deleted. It belongs in the release gate.
fail_under = 89

# ---- dead code ----
# Ruff (select = ALL) already covers unused imports/variables/arguments. Vulture covers what it
# cannot: symbols that are defined, exported and never referenced anywhere. Its whole cost is
# false positives on code the FRAMEWORK calls by decorator rather than by name, so those entry
# points are excluded — with that config it found four genuinely dead symbols on adoption.
[tool.vulture]
ignore_decorators = ["@*.get", "@*.post", "@*.put", "@*.delete", "@*.patch", "@*.head",
                     "@*.websocket", "@*validator", "@app.*", "@pytest.*"]
# model_config is pydantic's ConfigDict; pytestmark/should_exit/pytest_* are framework hooks read
# by name; capture_output is a subprocess kwarg a monkeypatch stub must accept but need not use.
# `stage` is a REQUEST-CONTRACT field on api_stopping.Condition: the model is `extra="forbid"`,
# so declaring it is what lets a client send it at all, and the round-trip is asserted through
# the JSON (`rows["s3"]["stage"]`) rather than through the attribute — which vulture cannot see.
# It went unreported for months only because an unrelated test held a local of the same name.
# `child_main` is the admission gate's preparation entry point. It is invoked from the `-c`
# bootstrap string `_bootstrap_cmd` builds (daemon/run_gate.py), so no static caller exists by
# construction — deleting it would remove a live entry point the daemon executes every gated fire.
ignore_names = ["model_config", "pytestmark", "should_exit", "pytest_*", "capture_output",
                "stage", "child_main"]
